# Staging on managed Supabase (Round 2 / G1): real Supabase Auth (JWKS) and the Supabase database
# through the transaction pooler as waas_runtime (RLS enforced). Own Redis; no host ports except the API on loopback.
# Configuration is generated on the host by scripts/supabase-staging-setup.sh into .env.supabase-app (0600).
name: ai-waas-supabase
services:
  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes: ["queue:/data"]
    networks: [internal]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 30}
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped
  api:
    image: atlashub-waas:staging
    env_file: ../.env.supabase-app
    environment: {REDIS_HOST: redis, BIND_HOST: 0.0.0.0}
    ports: ["127.0.0.1:14100:4000"]
    networks: [internal, egress]
    depends_on: {redis: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 384m
    cpus: 0.5
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  worker:
    image: atlashub-waas:staging
    command: ["node", "dist/services/worker/src/main.js"]
    env_file: ../.env.supabase-app
    environment: {REDIS_HOST: redis}
    networks: [internal, egress]
    depends_on: {redis: {condition: service_healthy}, api: {condition: service_healthy}}
    mem_limit: 384m
    cpus: 0.5
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
networks:
  internal: {internal: true}
  egress: {}
volumes:
  queue:
