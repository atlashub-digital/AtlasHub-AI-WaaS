name: atlashub-round1
services:
  postgres:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_USER: waas
      POSTGRES_DB: waas_staging
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waas -d waas_staging"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 512m
  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["queue:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 256m
  api:
    profiles: [application]
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: atlashub-waas:round1
    env_file: ../.env.staging
    environment:
      DATABASE_URL: ${APP_DATABASE_URL_OVERRIDE:-postgresql://waas_runtime:${RUNTIME_DB_PASSWORD:?required}@postgres:5432/waas_staging}
      REDIS_HOST: redis
      BIND_HOST: 0.0.0.0
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  worker:
    profiles: [application]
    image: atlashub-waas:round1
    command: ["node", "dist/services/worker/src/main.js"]
    env_file: ../.env.staging
    environment:
      DATABASE_URL: ${APP_DATABASE_URL_OVERRIDE:-postgresql://waas_runtime:${RUNTIME_DB_PASSWORD:?required}@postgres:5432/waas_staging}
      REDIS_HOST: redis
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 512m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  database:
  queue:
